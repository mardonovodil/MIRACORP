services:
  - type: web
    name: naturello-crm-api
    runtime: docker
    rootDir: naturello-crm-api
    plan: free
    envVars:
      - key: YANDEX360_EMAIL
        value: hello@naturello.food
      - key: YANDEX360_FROM_NAME
        value: NATURELLO Partnerships
      - key: YANDEX360_SMTP_HOST
        value: smtp.yandex.ru
      - key: YANDEX360_SMTP_PORT
        value: "465"
      - key: YANDEX360_IMAP_HOST
        value: imap.yandex.ru
      - key: YANDEX360_IMAP_PORT
        value: "993"
      - key: DAILY_SEND_LIMIT
        value: "25"
      - key: YANDEX360_PASSWORD
        sync: false

